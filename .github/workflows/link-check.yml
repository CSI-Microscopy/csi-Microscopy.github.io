# Weekly link check of the live sites: the home site and the five instrument
# sites (tools/link-check/linkcheck.py, Python standard library only).
# Fails on a broken internal link, image, PDF or stylesheet, or a missing
# #anchor; external links are reported as warnings. Results are in the job
# summary. Known problems that cannot be fixed here are listed in
# tools/link-check/known-broken.txt.
name: Link check

on:
  schedule:
    - cron: '43 5 * * 3'   # Wednesdays 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check links on the live sites
        run: python3 tools/link-check/linkcheck.py --depth 3
