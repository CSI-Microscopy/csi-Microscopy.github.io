# Monthly search for new papers by the unit's staff (tools/publications/monitor.py:
# Europe PMC, Crossref, OpenAlex and Semantic Scholar, full name + affiliation). Candidates not yet in
# assets/publications/publications.json or tools/publications/ignore.json are
# written to the job summary and to a GitHub issue labelled "publications"
# (one open issue is reused; a new comment is added per run). Nothing is added
# to the site automatically: a person checks each candidate, then adds it to
# publications.json (see readme.md, "Publications page") or to ignore.json.
name: Publications monitor

on:
  schedule:
    - cron: '23 4 2 * *'   # 2nd of each month, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Optional repository secrets: OPENALEX_API_KEY and S2_API_KEY (free keys) avoid the
      # per-address rate limits of OpenAlex and Semantic Scholar, which are skipped with a
      # note when they answer 429; MONITOR_MAILTO is a contact address for the Crossref and
      # OpenAlex "polite" pools. Europe PMC and Crossref need nothing.
      - name: Search Europe PMC, Crossref, OpenAlex and Semantic Scholar
        id: search
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          MONITOR_MAILTO: ${{ secrets.MONITOR_MAILTO }}
        run: python3 tools/publications/monitor.py --md candidates.md --json candidates.json --issue issue.md

      - name: Keep the full findings for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: publication-candidates
          path: |
            candidates.md
            candidates.json
          retention-days: 90

      # Posts the candidates (without the namesake/ignored details, which are in the job summary)
      # to one open issue labelled "publications", and only when the set of candidates differs
      # from the last post: issue.md ends with a fingerprint comment that is compared with the
      # issue's body and comments.
      - name: Open or update the "publications" issue
        if: steps.search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create publications --description "New publication candidates for publications.html" --color 1d76db --force
          fp=$(grep -o '<!-- candidates:[0-9a-f]* -->' issue.md | tail -n1)
          { cat issue.md; echo; echo "Workflow run: $RUN_URL"; } > body.md
          existing=$(gh issue list --label publications --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            if gh issue view "$existing" --json body,comments --jq '.body, .comments[].body' | grep -qF "$fp"; then
              echo "Same candidates as already posted on issue #$existing; nothing new to post."
            else
              gh issue comment "$existing" --body-file body.md
            fi
          else
            gh issue create --title "Publication candidates to check" --label publications --body-file body.md
          fi
