# Home repo CI for the shared renderer and the static build tool:
#   - guides/render.js must equal the bundle of guides/md-core.js + guides/render.src.js
#   - the build tool's tests (tools/build-docs/test.js) must pass
name: Check render.js bundle and build tool

on:
  push:
    branches: [main]
    paths:
      - 'guides/**'
      - 'tools/build-docs/**'
      - 'styles.css'
      - 'site.js'
      - 'index.html'
      - '.github/workflows/check-render-bundle.yml'
  pull_request:
    paths:
      - 'guides/**'
      - 'tools/build-docs/**'
      - 'styles.css'
      - 'site.js'
      - 'index.html'
      - '.github/workflows/check-render-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/build-docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/build-docs/package-lock.json

      - name: Install (marked 4.3.0)
        run: npm ci --no-audit --no-fund

      - name: guides/render.js is up to date
        run: node bundle-render.js --check

      - name: Tests
        run: node test.js
