<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0A716E">
    <title>CSI Microscopy — PDF Viewer</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <script>
        try { var t = localStorage.getItem('csi-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { height: 100vh; }

        main {
            display: flex;
            flex-direction: column;
            max-width: none;
            padding: 0;
            min-height: 0;
            overflow: hidden;
        }

        #pdf-toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem 1rem;
            padding: 0.55rem var(--gutter);
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }

        #pdf-title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 1rem;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #pdf-toolbar a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.7rem;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--ink);
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
        }
        #pdf-toolbar a:hover { background: var(--surface-2); border-color: var(--line-strong); text-decoration: none; }

        #pdf-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #525659;
        }

        #fallback {
            display: none;
            padding: 3rem var(--gutter);
            text-align: center;
        }
        #fallback p { margin: 0 auto 1rem; color: var(--muted); }

        @media (max-width: 560px) {
            #pdf-toolbar a .label { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a href="#" id="back-btn" class="back-btn"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> <span class="text">Back</span></a>
        <a href="../index.html"><i class="fa-solid fa-house" aria-hidden="true"></i> <span class="text">Home</span></a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
    </nav>

    <main>
        <div id="pdf-toolbar">
            <span id="pdf-title"></span>
            <a id="download-link" href="#" target="_blank" rel="noopener">
                <i class="fa-solid fa-download" aria-hidden="true"></i> <span class="label">Download PDF</span>
            </a>
            <a id="raw-link" href="#" target="_blank" rel="noopener">
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> <span class="label">Open in new tab</span>
            </a>
        </div>

        <iframe id="pdf-frame" title="PDF viewer"></iframe>

        <div id="fallback">
            <p>Your browser could not display the PDF inline.</p>
            <a id="fallback-link" href="#" class="btn btn-primary">
                <i class="fa-solid fa-file-pdf" aria-hidden="true"></i> Open PDF
            </a>
        </div>
    </main>

    <script src="../site.js"></script>
    <script>
        // ── Back button: go to previous viewer page if possible ─────────────────
        const backBtn = document.getElementById('back-btn');
        if (document.referrer && document.referrer.includes('viewer.html')) {
            backBtn.href = document.referrer;
        } else {
            backBtn.href = '../index.html';
        }

        // ── PDF loading ─────────────────────────────────────────────────────────
        const params  = new URLSearchParams(window.location.search);
        const pdfUrl  = params.get('url');
        const rawTitle = params.get('title');

        // raw.githubusercontent.com serves PDFs as "application/octet-stream" with
        // X-Content-Type-Options: nosniff, which forces a DOWNLOAD instead of an
        // inline preview. jsDelivr serves the same file as "application/pdf", so the
        // browser renders it inline. Convert raw GitHub URLs → jsDelivr for viewing.
        function toInlinePdfUrl(u) {
            const m = u.match(/^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
            if (!m) return u; // already absolute / other host — embed as-is
            const [, owner, repo, branch, path] = m;
            const cleanPath = path.replace(/\/\.\//g, '/').replace(/^\.\//, '');
            return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${cleanPath}`;
        }

        if (pdfUrl) {
            const inlineUrl = toInlinePdfUrl(pdfUrl);
            // Derive a human-readable title from filename if none supplied
            const filename    = decodeURIComponent(pdfUrl.split('/').pop().replace(/\.pdf$/i, '')).replace(/[-_]/g, ' ');
            const displayTitle = rawTitle ? decodeURIComponent(rawTitle) : filename;

            document.title                               = `CSI Microscopy — ${displayTitle}`;
            document.getElementById('pdf-title').textContent  = displayTitle;
            document.getElementById('download-link').href     = pdfUrl;     // raw URL → downloads the file
            document.getElementById('raw-link').href          = inlineUrl;  // jsDelivr → opens a viewable PDF
            document.getElementById('fallback-link').href     = inlineUrl;

            const frame = document.getElementById('pdf-frame');
            frame.src   = inlineUrl;

            // If the iframe fails to load (e.g. browser blocks inline PDF), show fallback
            frame.addEventListener('error', () => {
                frame.style.display = 'none';
                document.getElementById('fallback').style.display = 'block';
            });
        } else {
            document.getElementById('pdf-toolbar').style.display = 'none';
            document.getElementById('pdf-frame').style.display   = 'none';
            const fb = document.getElementById('fallback');
            fb.style.display = 'block';
            fb.querySelector('p').textContent = 'No PDF URL specified.';
        }
    </script>
</body>
</html>
