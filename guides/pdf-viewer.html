<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0A716E">
    <meta name="robots" content="noindex">
    <title>CSI Microscopy — PDF Viewer</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <script>
        try { var t = localStorage.getItem('csi-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { height: 100vh; }

        main {
            display: flex;
            flex-direction: column;
            max-width: none;
            padding: 0;
            min-height: 0;
            overflow: hidden;
        }

        #pdf-toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem 1rem;
            padding: 0.55rem var(--gutter);
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }

        #pdf-title {
            font-family: var(--f-display);
            font-weight: 600;
            font-size: 1rem;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #pdf-toolbar a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.7rem;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--ink);
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
        }
        #pdf-toolbar a:hover { background: var(--surface-2); border-color: var(--line-strong); text-decoration: none; }

        #pdf-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #525659;
        }

        #fallback {
            display: none;
            padding: 3rem var(--gutter);
            text-align: center;
        }
        #fallback p { margin: 0 auto 1rem; color: var(--muted); }

        @media (max-width: 560px) {
            #pdf-toolbar a .label { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a href="#" id="back-btn" class="back-btn"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> <span class="text">Back</span></a>
        <a href="../index.html"><i class="fa-solid fa-house" aria-hidden="true"></i> <span class="text">Home</span></a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
    </nav>

    <main>
        <div id="pdf-toolbar">
            <span id="pdf-title"></span>
            <a id="download-link" href="#" target="_blank" rel="noopener">
                <i class="fa-solid fa-download" aria-hidden="true"></i> <span class="label">Download PDF</span>
            </a>
            <a id="raw-link" href="#" target="_blank" rel="noopener">
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> <span class="label">Open in new tab</span>
            </a>
        </div>

        <iframe id="pdf-frame" title="PDF viewer"></iframe>

        <div id="fallback">
            <p>Your browser could not display the PDF inline.</p>
            <a id="fallback-link" href="#" class="btn btn-primary">
                <i class="fa-solid fa-file-pdf" aria-hidden="true"></i> Open PDF
            </a>
        </div>
    </main>

    <script src="../site.js"></script>
    <!-- Repo list, BUILT_REPOS and validators shared with render.js and the static build -->
    <script src="md-core.js"></script>
    <script>
        // Old links to this page keep working; new guide pages link PDFs
        // directly from the instrument's own Pages site instead.
        // SITE, KNOWN_REPOS (repo → published branch), BUILT_REPOS (repos on
        // the static build) and the name/branch rules come from md-core.js.
        const { SITE, KNOWN_REPOS, BUILT_REPOS, validBranch } = window.CSIMd;
        const params   = new URLSearchParams(window.location.search);
        const pdfUrl   = (params.get('url') || '').trim();
        const rawTitle = params.get('title');

        // ── Accept only the facility's own PDFs (D2) ────────────────────────────
        const knownRepo = s => Object.keys(KNOWN_REPOS).find(r => r.toLowerCase() === String(s).toLowerCase()) || null;

        // Parses an allowed PDF URL into validated parts, or returns null:
        //   https://raw.githubusercontent.com/CSI-Microscopy/<known repo>/<branch>/<path>.pdf
        //   https://csi-microscopy.github.io/<known repo>/<path>.pdf
        // The URL is parsed first and the normalised pathname is checked; any
        // "."/".." segment (also as %2e) is refused, except the legacy "/./"
        // that old links contain. All URLs below are built from these parts.
        function parsePdf(u) {
            if (typeof u !== 'string' || !u || u.length > 2000) return null;
            const s = u.replace(/\/\.(?=\/)/g, '');                         // legacy "/./"
            if (/(^|\/)(\.|%2e){1,2}(\/|$)/i.test(s.split(/[?#]/)[0])) return null;
            let x;
            try { x = new URL(s); } catch (_) { return null; }
            if (x.protocol !== 'https:' || x.username || x.password || x.port) return null;
            const segs = x.pathname.split('/').slice(1);
            let repo, branch = null, pathSegs;
            if (x.hostname === 'raw.githubusercontent.com') {
                if (segs.length < 4 || segs[0].toLowerCase() !== 'csi-microscopy') return null;
                repo = knownRepo(segs[1]); branch = segs[2]; pathSegs = segs.slice(3);
                if (!validBranch(branch)) return null;
            } else if (x.hostname === 'csi-microscopy.github.io') {
                if (segs.length < 2) return null;
                repo = knownRepo(segs[0]); pathSegs = segs.slice(1);
            } else return null;
            if (!repo) return null;
            for (const seg of pathSegs) {
                let d; try { d = decodeURIComponent(seg); } catch (_) { return null; }
                if (!seg || d === '.' || d === '..' || /[\/\\\u0000-\u001f]/.test(d)) return null;
            }
            const path = pathSegs.join('/');
            if (!/\.pdf$/i.test(path)) return null;
            // keep only a plain viewer fragment such as #page=3
            const frag = /^#[A-Za-z0-9=&._-]{1,60}$/.test(x.hash) ? x.hash : '';
            return { host: x.hostname, repo, branch, path, frag };
        }
        const isAllowed = u => !!parsePdf(u);
        const allowed = !!parsePdf(pdfUrl);
        const rawParts = u => { const p = parsePdf(u); return p && p.branch ? p : null; };

        // Viewable URL: the same-site Pages copy for a known repo's published
        // branch (served as application/pdf); jsDelivr for other branches
        // (raw.githubusercontent serves octet-stream, which downloads).
        function toInlinePdfUrl(u) {
            const p = parsePdf(u);
            if (!p) return null;
            if (!p.branch || KNOWN_REPOS[p.repo] === p.branch) return `${SITE}${p.repo}/${p.path}${p.frag}`;
            return `https://cdn.jsdelivr.net/gh/CSI-Microscopy/${p.repo}@${p.branch}/${p.path}${p.frag}`;
        }
        // Download: the raw file (served as octet-stream) or the Pages copy
        function toDownloadUrl(u) {
            const p = parsePdf(u);
            if (!p) return null;
            return p.branch ? `https://raw.githubusercontent.com/CSI-Microscopy/${p.repo}/${p.branch}/${p.path}`
                            : `${SITE}${p.repo}/${p.path}`;
        }

        // Title: accept a correctly encoded title and the old double-encoded
        // form ("%2520"); never throw on a stray "%" (D14).
        function decodeTitle(t) {
            let s = t;
            for (let i = 0; i < 2 && /%[0-9a-f]{2}/i.test(s); i++) {
                try { s = decodeURIComponent(s); } catch (_) { break; }
            }
            return s.slice(0, 120);
        }

        // ── Built repos: go straight to the same-site PDF (step 1.6) ────────────
        // A PDF on the published branch of a repo that is on the static build
        // is served by that repo's own site; the built pages link it directly.
        // Other branches (previews) and other repos keep the viewer below.
        {
            const p = parsePdf(pdfUrl);
            if (p && BUILT_REPOS.indexOf(p.repo) >= 0 && (!p.branch || p.branch === KNOWN_REPOS[p.repo])) {
                window.location.replace(`${SITE}${p.repo}/${p.path}${p.frag}`);
            }
        }

        // ── Back button (D10) ───────────────────────────────────────────────────
        // Came from this site: go back in history. Otherwise: the instrument
        // page the PDF belongs to, else home.
        const backBtn = document.getElementById('back-btn');
        let fromSite = false;
        try {
            const ref = document.referrer ? new URL(document.referrer) : null;
            fromSite = !!ref && (ref.origin === new URL(SITE).origin || ref.origin === window.location.origin);
        } catch (_) { /* ignore */ }
        let instrumentRoot = null;
        if (allowed) instrumentRoot = `${SITE}${parsePdf(pdfUrl).repo}/`;
        backBtn.href = fromSite ? document.referrer : (instrumentRoot || '../index.html');
        if (fromSite && window.history.length > 1) {
            backBtn.addEventListener('click', e => { e.preventDefault(); window.history.back(); });
        }

        // ── PDF loading ─────────────────────────────────────────────────────────
        if (allowed) {
            const inlineUrl = toInlinePdfUrl(pdfUrl);
            const lastSeg   = parsePdf(pdfUrl).path.split('/').pop();
            const filename  = decodeTitle(lastSeg).replace(/\.pdf$/i, '').replace(/[-_]/g, ' ');
            const displayTitle = rawTitle ? decodeTitle(rawTitle) : filename;

            document.title                               = `CSI Microscopy — ${displayTitle}`;
            document.getElementById('pdf-title').textContent  = displayTitle;
            // raw URL downloads the file; a Pages URL gets the download attribute
            const dl = document.getElementById('download-link');
            dl.href = toDownloadUrl(pdfUrl);
            if (!parsePdf(pdfUrl).branch) dl.setAttribute('download', '');
            document.getElementById('raw-link').href          = inlineUrl;
            document.getElementById('fallback-link').href     = inlineUrl;

            const frame = document.getElementById('pdf-frame');
            frame.src   = inlineUrl;

            // If the iframe fails to load (e.g. browser blocks inline PDF), show fallback
            frame.addEventListener('error', () => {
                frame.style.display = 'none';
                document.getElementById('fallback').style.display = 'block';
            });
        } else {
            document.getElementById('pdf-toolbar').remove();   // no download link
            const frame = document.getElementById('pdf-frame');
            frame.style.display = 'none';
            frame.remove();
            const fb = document.getElementById('fallback');
            fb.style.display = 'block';
            fb.querySelector('p').textContent = pdfUrl
                ? 'This link does not point to a CSI Microscopy document, so it is not shown here.'
                : 'No PDF URL specified.';
            const link = document.getElementById('fallback-link');
            link.href = '../index.html#startup-shutdown-guides';
            link.innerHTML = '<i class="fa-solid fa-book" aria-hidden="true"></i> Instrument guides';
        }
    </script>
</body>
</html>
