<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Faculty of Agriculture CSI Microscopy - Guide viewer (preview of instrument guides)">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0A716E">
    <meta name="robots" content="noindex">
    <title>CSI Microscopy — Guide</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <script>
        try { var t = localStorage.getItem('csi-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="guide.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> <span class="text">Home</span></a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
    </nav>

    <main>
        <section id="guide-content">
            <div id="status-message"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Loading guide…</div>
            <h1 id="guide-title" style="display:none;"></h1>
            <p class="guide-meta" id="guide-meta" style="display:none;"></p>
            <div id="markdown-body"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Daniel Waiger · Faculty of Agriculture CSI Microscopy</p>
    </footer>

    <!-- Shared renderer: reads ?repo=&branch=&path=&title= from the URL.
         For a repo listed in CSIMd.BUILT_REPOS (guides/md-core.js) on its
         published branch it redirects to the built page (/<Repo>/<path>);
         other branches are rendered here as a preview. -->
    <script src="render.js"></script>
</body>
</html>
